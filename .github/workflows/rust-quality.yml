name: Rust quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: fmt, check, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      # 注意：**不要**开 `submodules`。`history-data-pipeline` 是 submodule，
      # 但 (a) 它的 `dist/history.duckdb` fixture 被其 .gitignore 排除，
      # (b) 本地记录的 submodule commit 未必推送到远端 —— 开 recursive
      # 会让 checkout 以 "not our ref" 直接失败。
      # desktop 测试在 fixture 缺失时自行跳过（见 personal_ai.rs tests）。
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      # Tauri 在 Linux 需要 GTK / WebKitGTK 系统库（官方文档清单）
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo fmt --check
      - run: cargo check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

