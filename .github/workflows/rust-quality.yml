name: Rust quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop-e2e:
    name: Tauri desktop E2E (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/desktop/ui/package-lock.json
      - name: Install test dependencies
        run: |
          npm ci --prefix apps/desktop
          npm ci --prefix apps/desktop/ui
      # duckdb 不进 Git；Tauri bundle.resources 在缺文件时会让整个 E2E 构建失败。
      - name: Provide placeholder history duckdb for bundle
        run: |
          New-Item -ItemType Directory -Force -Path history-data-pipeline/dist | Out-Null
          if (-not (Test-Path history-data-pipeline/dist/history.duckdb)) {
            New-Item -ItemType File -Path history-data-pipeline/dist/history.duckdb | Out-Null
          }
      - name: Run native Tauri regression suite
        run: npm --prefix apps/desktop run test:e2e
      - name: Upload desktop failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-artifacts
          path: output/desktop-e2e/
          if-no-files-found: ignore

  quality:
    name: fmt, check, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      # 注意：**不要**开 `submodules`。`history-data-pipeline` 是 submodule，
      # 但 (a) 它的 `dist/history.duckdb` fixture 被其 .gitignore 排除，
      # (b) 本地记录的 submodule commit 未必推送到远端 —— 开 recursive
      # 会让 checkout 以 "not our ref" 直接失败。
      # desktop 测试在 fixture 缺失时自行跳过（见 personal_ai.rs tests）。
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      # Tauri 在 Linux 需要 GTK / WebKitGTK 系统库（官方文档清单）
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo fmt --check
      - run: cargo check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
