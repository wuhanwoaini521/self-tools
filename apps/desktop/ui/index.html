<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：让 safe-area-inset-* 在 iOS 生效（V11 §89）。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e6b58'/%3E%3Cpath d='M9 10h9a6 6 0 0 1 0 12H9z' fill='%23f7fff9'/%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- PWA（V11 §76-§79）：可安装、standalone、主题色。 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f3efe6" />
    <meta name="color-scheme" content="dark light" />
    <!-- iOS standalone 支持（Safari 不读 manifest 的 display）。 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="self-tools" />
    <meta name="application-name" content="self-tools" />
    <meta
      name="description"
      content="Self Tools：学习、旅行、资讯。"
    />
    <title>Self Tools</title>
    <style>
      /* safe-area 变量（V11 §89）：底部导航 / AI 输入框消费。 */
      :root {
        --safe-area-top: env(safe-area-inset-top, 0px);
        --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        --safe-area-left: env(safe-area-inset-left, 0px);
        --safe-area-right: env(safe-area-inset-right, 0px);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
