<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：让 safe-area-inset-* 在 iOS 生效（V11 §89）。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1315'/%3E%3Cpath d='M8 9h8a7 7 0 0 1 0 14H8z' fill='%231688ff'/%3E%3Cpath d='M20 10h4v12h-4z' fill='%23d6dce0'/%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- PWA（V11 §76-§79）：可安装、standalone、主题色。 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d1315" />
    <meta name="color-scheme" content="dark light" />
    <!-- iOS standalone 支持（Safari 不读 manifest 的 display）。 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="self-tools" />
    <meta name="application-name" content="self-tools" />
    <meta
      name="description"
      content="个人 AI 中枢：学习、知识、家庭服务器，一个入口。"
    />
    <title>self-tools · Personal AI Hub</title>
    <style>
      /* safe-area 变量（V11 §89）：底部导航 / AI 输入框消费。 */
      :root {
        --safe-area-top: env(safe-area-inset-top, 0px);
        --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        --safe-area-left: env(safe-area-inset-left, 0px);
        --safe-area-right: env(safe-area-inset-right, 0px);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
