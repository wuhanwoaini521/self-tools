[package]
name = "devtoolbox-mcp"
description = "Self Tools MCP transport (STDIO + Streamable HTTP) — a thin protocol adapter over ToolRegistry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1"
devtoolbox-application = { path = "../../crates/application" }
devtoolbox-core = { path = "../../crates/core" }
devtoolbox-infrastructure = { path = "../../crates/infrastructure" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "signal", "net"] }
axum = "0.8"

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
