[project]
name = "oxnote"
version = "0.1.0"
description = "跨平台 Markdown 笔记工具，核心特色是多状态 Checkbox"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyside6>=6.5",
    "markdown>=3.4",
]

[tool.pytest.ini_options]
# 让 pytest 能从项目根导入 src 包
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
# 应用型项目：只做环境与依赖管理，不作为分发包构建
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
