[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "history-data-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.0"]

[project.scripts]
history-data = "history_data_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
